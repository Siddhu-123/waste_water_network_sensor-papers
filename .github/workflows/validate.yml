name: Build and publish research library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-library-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/geography_requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF extraction dependencies
        run: python -m pip install -r scripts/geography_requirements.txt
      - name: Install OCR engine
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Restore incremental geography cache
        uses: actions/cache@v4
        with:
          path: .cache/research-geography
          key: geography-v1-${{ runner.os }}-${{ hashFiles('scripts/build_research_geography.py', 'data/geography/**') }}-${{ github.sha }}
          restore-keys: |
            geography-v1-${{ runner.os }}-${{ hashFiles('scripts/build_research_geography.py', 'data/geography/**') }}-
      - name: Exercise automatic ingestion and false-positive handling
        run: python -m unittest discover -s scripts -p test_research_geography.py -v
      - name: Generate research locations
        run: python scripts/build_research_geography.py --extractor pdfplumber --ocr --gazetteer data/geography/cities15000.zip --cache .cache/research-geography/extraction-cache.json --report .cache/research-geography/report.json
      - name: Rebuild browser data
        run: python scripts/build_bundled_data.py
      - name: Validate contributor data and PDF links
        run: python scripts/validate_repo.py
      - name: Validate generated geography
        run: python scripts/validate_research_geography.py
      - name: Stage public site
        if: github.event_name != 'pull_request'
        run: python scripts/package_pages.py --output _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish generated library
        id: deployment
        uses: actions/deploy-pages@v4
