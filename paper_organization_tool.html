<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Research Paper Organization Tool</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- PDF.js for Client-Side Background PDF Text & Metadata Extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
    </script>

    <style>
        :root {
            --bg-primary: #080c16;
            --bg-secondary: #0f172a;
            --bg-card: rgba(18, 26, 47, 0.85);
            --bg-card-hover: rgba(26, 38, 68, 0.95);
            --border-color: #1e293b;
            --border-light: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #38bdf8;
            --key-yellow: #fbbf24;
            --font-mono: "JetBrains Mono", monospace;
            --radius-md: 10px;
            --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 32px 40px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: 100vh;
        }
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 28px; font-weight: 800; color: #fff; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 9px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; border: 1px solid transparent; text-decoration: none;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--bg-secondary); border-color: var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .btn-danger:hover { background: #ef4444; color: white; }
        .btn-sm { padding: 6px 11px; font-size: 12px; }
        
        .controls-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 14px; }
        .search-input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; padding: 10px 16px; border-radius: var(--radius-md); font-size: 13.5px; outline: none; }
        .search-input:focus { border-color: var(--accent-cyan); }

        .papers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        .paper-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .paper-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .paper-meta { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 12px; }
        .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-color); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 24px; }
        .modal-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; position: sticky; top: 0; background: #0f172a; z-index: 10; }
        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0; background: #0f172a; z-index: 10; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .form-input, .form-textarea { background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; padding: 10px 14px; border-radius: var(--radius-md); width: 100%; }
        .form-textarea { min-height: 80px; resize: vertical; }
        
        .upload-dropzone { border: 2px dashed var(--border-light); padding: 24px; text-align: center; cursor: pointer; border-radius: var(--radius-lg); margin-bottom: 16px; background: rgba(15,23,42,0.5); }
        .upload-dropzone:hover { border-color: var(--accent-cyan); }

        .step-item { background: rgba(30,41,59,0.5); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 12px; }
        .step-label { font-size: 12px; color: var(--key-yellow); font-weight: 700; margin-bottom: 6px; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>My Research Papers</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="openAddPaperModal()">+ Add Research Paper</button>
                <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
                <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
            </div>
        </div>
        <div class="controls-card">
            <input type="text" class="search-input" id="searchInput" placeholder="Search papers..." onkeyup="renderPapers()">
        </div>
    </header>

    <main>
        <div class="papers-grid" id="papersGrid"></div>
    </main>

    <!-- 8-Step Summary Modal -->
    <div class="modal-overlay" id="summaryModal" onclick="if(event.target.id==='summaryModal') closeModal('summaryModal')">
        <div class="modal-card">
            <div class="modal-header">
                <div id="modalPaperTitle" style="font-weight: 700; font-size: 18px;">Title</div>
                <button class="btn btn-secondary btn-sm" onclick="closeModal('summaryModal')">&times;</button>
            </div>
            <div class="modal-body" id="summaryBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="copyMarkdown()">Copy Markdown</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal with PDF Parser -->
    <div class="modal-overlay" id="formModal" onclick="if(event.target.id==='formModal') closeModal('formModal')">
        <div class="modal-card">
            <div class="modal-header">
                <div style="font-weight: 700; font-size: 18px;" id="formTitle">Add / Edit Paper</div>
                <button class="btn btn-secondary btn-sm" onclick="closeModal('formModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="paperForm" onsubmit="savePaper(event)">
                    <input type="hidden" id="paperId">
                    
                    <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('pdfFileInput').click()">
                        <strong>Drop PDF Here or Click to Upload</strong>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Real client-side PDF parser using pdf.js to extract title & text.</div>
                        <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(this.files[0])">
                    </div>
                    
                    <div id="parseStatus" style="display: none; color: #10b981; font-size: 12px; margin-bottom: 12px;">✅ PDF Parsed Locally.</div>

                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-input" id="inpTitle" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Authors</label>
                        <input type="text" class="form-input" id="inpAuthors">
                    </div>
                    <div class="form-group">
                        <label class="form-label">PDF URL / Path</label>
                        <input type="text" class="form-input" id="inpPdf">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Google Scholar URL</label>
                        <input type="text" class="form-input" id="inpScholar">
                    </div>

                    <h4 style="margin-top: 20px; color: var(--key-yellow);">8-Step Summary</h4>
                    <div class="form-group"><label class="form-label">1. Citation</label><textarea class="form-textarea" id="step1"></textarea></div>
                    <div class="form-group"><label class="form-label">2. Introduction</label><textarea class="form-textarea" id="step2"></textarea></div>
                    <div class="form-group"><label class="form-label">3. Methods</label><textarea class="form-textarea" id="step3"></textarea></div>
                    <div class="form-group"><label class="form-label">4. Scope</label><textarea class="form-textarea" id="step4"></textarea></div>
                    <div class="form-group"><label class="form-label">5. Usefulness</label><textarea class="form-textarea" id="step5"></textarea></div>
                    <div class="form-group"><label class="form-label">6. Limitations</label><textarea class="form-textarea" id="step6"></textarea></div>
                    <div class="form-group"><label class="form-label">7. Conclusions</label><textarea class="form-textarea" id="step7"></textarea></div>
                    <div class="form-group"><label class="form-label">8. Reflection</label><textarea class="form-textarea" id="step8"></textarea></div>

                    <div class="modal-footer" style="margin: 20px -24px -24px -24px;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('formModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Paper</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

        let papers = [];
        let activeSummaryId = null;

        function init() {
            const stored = localStorage.getItem("my_papers");
            if (stored) {
                try { papers = JSON.parse(stored); } catch(e) { papers = [...ORIGINAL_PAPERS]; }
            } else {
                papers = [...ORIGINAL_PAPERS];
                save();
            }
            renderPapers();
            initDropzone();
        }

        function save() {
            localStorage.setItem("my_papers", JSON.stringify(papers));
        }

        function renderPapers() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const grid = document.getElementById("papersGrid");
            grid.innerHTML = "";
            
            papers.forEach(p => {
                if (query && !p.title.toLowerCase().includes(query)) return;
                
                const div = document.createElement("div");
                div.className = "paper-card";
                div.innerHTML = `
                    <div>
                        <div class="paper-title">${p.title}</div>
                        <div class="paper-meta">${p.authors || "Unknown Authors"}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-secondary btn-sm" onclick="openSummary(${p.id})">📝 8-Step</button>
                        <a class="btn btn-primary btn-sm" href="${p.pdfUrl || '#'}" target="_blank">📄 PDF</a>
                        <a class="btn btn-secondary btn-sm" href="${p.scholarUrl || '#'}" target="_blank">🔍 Scholar</a>
                        <button class="btn btn-secondary btn-sm" onclick="editPaper(${p.id})">✏️</button>
                        <button class="btn btn-danger btn-sm" onclick="deletePaper(${p.id})">🗑️</button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function openSummary(id) {
            const p = papers.find(x => x.id === id);
            if(!p) return;
            activeSummaryId = id;
            document.getElementById("modalPaperTitle").innerText = p.title;
            
            const steps = p.steps || {};
            let html = "";
            for(let i=1; i<=8; i++) {
                const keys = ["citation","intro","methods","scope","usefulness","limitations","conclusions","reflection"];
                html += `<div class="step-item"><div class="step-label">Step ${i}</div><div>${steps[keys[i-1]] || ""}</div></div>`;
            }
            document.getElementById("summaryBody").innerHTML = html;
            document.getElementById("summaryModal").style.display = "flex";
        }

        function copyMarkdown() {
            const p = papers.find(x => x.id === activeSummaryId);
            if(!p) return;
            const s = p.steps || {};
            const md = `# ${p.title}

1. Citation
${s.citation}

2. Intro
${s.intro}

3. Methods
${s.methods}

4. Scope
${s.scope}

5. Usefulness
${s.usefulness}

6. Limitations
${s.limitations}

7. Conclusions
${s.conclusions}

8. Reflection
${s.reflection}`;
            navigator.clipboard.writeText(md);
            alert("Copied Markdown!");
        }

        function openAddPaperModal() {
            document.getElementById("paperForm").reset();
            document.getElementById("paperId").value = "";
            document.getElementById("parseStatus").style.display = "none";
            document.getElementById("formModal").style.display = "flex";
        }

        function editPaper(id) {
            const p = papers.find(x => x.id === id);
            if(!p) return;
            document.getElementById("paperId").value = p.id;
            document.getElementById("inpTitle").value = p.title || "";
            document.getElementById("inpAuthors").value = p.authors || "";
            document.getElementById("inpPdf").value = p.pdfUrl || "";
            document.getElementById("inpScholar").value = p.scholarUrl || "";
            
            const s = p.steps || {};
            document.getElementById("step1").value = s.citation || "";
            document.getElementById("step2").value = s.intro || "";
            document.getElementById("step3").value = s.methods || "";
            document.getElementById("step4").value = s.scope || "";
            document.getElementById("step5").value = s.usefulness || "";
            document.getElementById("step6").value = s.limitations || "";
            document.getElementById("step7").value = s.conclusions || "";
            document.getElementById("step8").value = s.reflection || "";
            
            document.getElementById("formModal").style.display = "flex";
        }

        function savePaper(e) {
            e.preventDefault();
            const id = document.getElementById("paperId").value;
            const p = {
                title: document.getElementById("inpTitle").value,
                authors: document.getElementById("inpAuthors").value,
                pdfUrl: document.getElementById("inpPdf").value,
                scholarUrl: document.getElementById("inpScholar").value,
                steps: {
                    citation: document.getElementById("step1").value,
                    intro: document.getElementById("step2").value,
                    methods: document.getElementById("step3").value,
                    scope: document.getElementById("step4").value,
                    usefulness: document.getElementById("step5").value,
                    limitations: document.getElementById("step6").value,
                    conclusions: document.getElementById("step7").value,
                    reflection: document.getElementById("step8").value
                }
            };

            if(id) {
                const idx = papers.findIndex(x => x.id == id);
                p.id = parseInt(id);
                papers[idx] = {...papers[idx], ...p};
            } else {
                p.id = Date.now();
                papers.unshift(p);
            }
            save();
            closeModal("formModal");
            renderPapers();
        }

        function deletePaper(id) {
            if(confirm("Delete this paper?")) {
                papers = papers.filter(x => x.id !== id);
                save();
                renderPapers();
            }
        }

        function clearAll() {
            if(confirm("Clear all papers?")) {
                papers = [];
                save();
                renderPapers();
            }
        }

        function exportJSON() {
            const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(papers, null, 2));
            const a = document.createElement("a");
            a.href = str;
            a.download = "my_research_papers.json";
            a.click();
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        // PDF Parser Logic
        async function handlePdfUpload(file) {
            if (!file || file.type !== "application/pdf") return;
            document.getElementById("inpPdf").value = `./${file.name}`;
            document.getElementById("parseStatus").style.display = "block";
            document.getElementById("parseStatus").innerText = "⏳ Parsing PDF locally in browser...";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                if (window.pdfjsLib) {
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdf = await loadingTask.promise;
                    const page1 = await pdf.getPage(1);
                    const textContent = await page1.getTextContent();
                    const rawStrings = textContent.items.map(i => i.str.trim()).filter(s => s.length > 0);
                    
                    let title = rawStrings.slice(0, 4).join(" ");
                    if(title.length < 10) title = file.name.replace(".pdf","");
                    
                    document.getElementById("inpTitle").value = title;
                    document.getElementById("inpScholar").value = `https://scholar.google.com/scholar?q=${encodeURIComponent(title)}`;
                    document.getElementById("parseStatus").innerText = `✅ PDF Parsed Locally: Extracted text from ${pdf.numPages} pages.`;
                }
            } catch(e) {
                document.getElementById("parseStatus").innerText = "⚠️ Failed to extract text. Used filename for title.";
                document.getElementById("inpTitle").value = file.name.replace(".pdf","");
            }
        }

        function initDropzone() {
            const dz = document.getElementById("dropzone");
            dz.addEventListener("dragover", e => { e.preventDefault(); dz.style.borderColor = "#38bdf8"; });
            dz.addEventListener("dragleave", e => { e.preventDefault(); dz.style.borderColor = "#334155"; });
            dz.addEventListener("drop", e => {
                e.preventDefault();
                dz.style.borderColor = "#334155";
                if(e.dataTransfer.files.length) handlePdfUpload(e.dataTransfer.files[0]);
            });
        }

        window.onload = init;
    </script>
