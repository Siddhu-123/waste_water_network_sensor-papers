        function escapeHtml(str) {
          return String(str || "").replace(/[&<>'"]/g, (tag) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;",
          }[tag] || tag));
        }

        /* Real Text Highlighting on Mouse Up */
        function mergeLineBoxes(rawBoxes) {
          if (!rawBoxes || rawBoxes.length <= 1) return rawBoxes || [];

          // Sort boxes primarily by vertical position (y), then horizontal (x)
          const sorted = [...rawBoxes].sort((a, b) => {
            if (Math.abs(a.y - b.y) > 0.005) {
              return a.y - b.y;
            }
            return a.x - b.x;
          });

          const merged = [];
          let current = { ...sorted[0] };

          for (let i = 1; i < sorted.length; i++) {
            const next = sorted[i];
            const sameLine = Math.abs(current.y - next.y) < 0.006 && Math.abs(current.height - next.height) < 0.008;
            const horizontallyAdjacent = next.x <= current.x + current.width + 0.015;

            if (sameLine && horizontallyAdjacent) {
              const right = Math.max(current.x + current.width, next.x + next.width);
              current.width = right - current.x;
              current.y = Math.min(current.y, next.y);
              current.height = Math.max(current.height, next.height);
            } else {
              merged.push(current);
              current = { ...next };
            }
          }
          merged.push(current);
          return merged;
        }

        /* Real Text Highlighting on Mouse Up */
        function handleTextSelection() {
          if (activeTool !== "highlight") return;
          const selection = window.getSelection();
          if (!selection || selection.isCollapsed) return;

          const text = selection.toString().trim();
          if (!text) return;

          const range = selection.getRangeAt(0);
          const commonAncestor = range.commonAncestorContainer;
          const pageEl = (commonAncestor.nodeType === 1 ? commonAncestor : commonAncestor.parentElement).closest(".pdf-page");
          if (!pageEl) return;

          const pageNumber = Number(pageEl.dataset.pageNumber);
          const pageRect = pageEl.getBoundingClientRect();
          const clientRects = Array.from(range.getClientRects());
          if (!clientRects.length) return;

          const rawBoxes = [];
          for (const cr of clientRects) {
            // Ignore degenerate / tiny rects (artifacts, zero-dimension marks)
            if (cr.width < 5 || cr.height < 5) continue;
            rawBoxes.push({
              x: clamp((cr.left - pageRect.left) / pageRect.width, 0, 1),
              y: clamp((cr.top - pageRect.top) / pageRect.height, 0, 1),
              width: clamp(cr.width / pageRect.width, 0.001, 1),
              height: clamp(cr.height / pageRect.height, 0.001, 1),
            });
          }

          selection.removeAllRanges();
          const boxes = mergeLineBoxes(rawBoxes);
          if (!boxes.length) return;

          const next = snapshot();
          const annotation = {
            id: newId("highlight"),
            type: "highlight",
            page: pageNumber,
            text: text,
            boxes: boxes,
            x: boxes[0].x,
            y: boxes[0].y,
            width: boxes[0].width,
            height: boxes[0].height,
            color: elements.color.value,
            createdBy: getActiveUser(),
            createdAt: new Date().toISOString(),
          };
          next.push(annotation);
          commitChange(next, annotation.id);
          setStatus(`Highlighted text on Page ${pageNumber}`, "success");
        }

        document.addEventListener("mouseup", handleTextSelection);

        /* Render Highlights & Sticky Notes on Page */
        function renderAnnotationsForPage(pageNumber) {
          const layer = pageLayers.get(pageNumber);
          if (!layer) return;
          layer.querySelectorAll(".annotation").forEach((node) => node.remove());
          layer.classList.toggle("tool-note", activeTool === "note");

          const pageAnns = annotations.filter((a) => {
            if (Number(a.page) !== pageNumber) return false;
            if (a.status === "deleted") return false;
            if (a.id === activeExpandedNoteId) return true;
            return validAnnotation(a);
          });
          pageAnns.forEach((annotation) => {
            if (annotation.type === "highlight") {
              const rawBoxes = annotation.boxes && annotation.boxes.length
                ? annotation.boxes
                : [{ x: annotation.x, y: annotation.y, width: annotation.width, height: annotation.height }];
              const boxes = mergeLineBoxes(rawBoxes);
              const isSelected = selectedAnnotationId === annotation.id;

              boxes.forEach((box) => {
                const el = document.createElement("div");
                el.className = "annotation highlight-annotation" + (isSelected ? " selected" : "");
                el.dataset.annotationId = annotation.id;
                el.style.left = box.x * 100 + "%";
                el.style.top = box.y * 100 + "%";
                el.style.width = box.width * 100 + "%";
                el.style.height = box.height * 100 + "%";
                el.style.backgroundColor = annotation.color || elements.color.value;
                el.title = `Highlighted by ${annotation.createdBy || "Contributor"}: "${annotation.text || ""}"`;

                el.addEventListener("click", (event) => {
                  event.stopPropagation();
                  selectAnnotation(annotation.id);
                });
                layer.appendChild(el);
              });
            } else {
              const author = annotation.createdBy || "Contributor";
              const palette = getPersonPalette(author);
              const shortTitle = getShortNoteTitle(annotation);

              const isExpanded = annotation.id === activeExpandedNoteId;
              if (isExpanded) {
                const expanded = document.createElement("div");
                expanded.className = "annotation sticky-note-expanded";
                expanded.dataset.annotationId = annotation.id;
                expanded.style.left = (annotation.x * 100) + "%";
                expanded.style.top = (annotation.y * 100) + "%";

                let transformStr = "rotate(-0.8deg)";
                if (annotation.x > 0.62 && annotation.y > 0.68) {
                  transformStr = "translate(-85%, -85%) rotate(-0.8deg)";
                } else if (annotation.x > 0.62) {
                  transformStr = "translate(-85%, 0) rotate(-0.8deg)";
                } else if (annotation.y > 0.68) {
                  transformStr = "translate(0, -85%) rotate(-0.8deg)";
                }
                expanded.style.transform = transformStr;

                expanded.innerHTML = `
                  <div class="sticky-note-header">
                    <span class="sticky-note-author-tag">
                      <span class="sticky-note-author-dot" style="background:${palette.light}"></span>
                      <span>${escapeHtml(author)}</span>
                    </span>
                    <button class="sticky-note-close-btn" type="button" title="Minimize (Enter)">✕</button>
                  </div>
                  <textarea class="sticky-note-textarea" placeholder="Type your note here…" maxlength="2000">${escapeHtml(annotation.text || "")}</textarea>
                  <div class="sticky-note-footer">
                    <span>⏎ Enter to minimize</span>
                    <span>Shift+Enter newline</span>
                  </div>
                `;

                const ta = expanded.querySelector(".sticky-note-textarea");
                const closeBtn = expanded.querySelector(".sticky-note-close-btn");

                closeBtn.addEventListener("click", (e) => {
                  e.stopPropagation();
                  minimizeExpandedNote();
                });

                ta.addEventListener("keydown", (e) => {
                  if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    minimizeExpandedNote();
                  } else if (e.key === "Escape") {
                    e.preventDefault();
                    minimizeExpandedNote();
                  }
                });

                expanded.addEventListener("pointerdown", (e) => {
                  e.stopPropagation();
                });
                expanded.addEventListener("mousedown", (e) => {
                  e.stopPropagation();
                });
                expanded.addEventListener("click", (e) => {
                  e.stopPropagation();
                });

                layer.appendChild(expanded);
              } else {
                const element = document.createElement("div");
                element.className = "annotation sticky-note" + (selectedAnnotationId === annotation.id ? " selected" : "");
                element.dataset.annotationId = annotation.id;
                element.style.left = (annotation.x * 100) + "%";
                element.style.top = (annotation.y * 100) + "%";
                element.title = `${shortTitle} (${author}): ${annotation.text}`;
                element.setAttribute("aria-label", `Sticky Note: ${shortTitle}`);

                element.innerHTML = `
                  <div class="sticker-lines">
                    <span class="sticker-line"></span>
                    <span class="sticker-line"></span>
                    <span class="sticker-line"></span>
                  </div>
                  <div class="sticker-footer">
                    <span class="sticker-author-dot" style="background:${palette.light}"></span>
                    <span class="sticker-icon">📌</span>
                  </div>
                `;

                element.addEventListener("pointerdown", (event) => {
                  event.stopPropagation();
                  beginNoteStickerInteraction(annotation, element, layer, event);
                });

                layer.appendChild(element);
              }
            }
          });
        }

        function renderAnnotations() {
          pageLayers.forEach((_, pageNumber) => {
            renderAnnotationsForPage(pageNumber);
          });
          updateActionState();
        }

        function beginNoteStickerInteraction(annotation, element, layer, event) {
          if (activeExpandedNoteId && activeExpandedNoteId !== annotation.id) {
            minimizeExpandedNote();
          }

          selectAnnotation(annotation.id);

          const point = getPoint(event, layer);
          const startClientX = event.clientX;
          const startClientY = event.clientY;

          dragNoteSession = {
            annotation,
            element,
            layer,
            pointerId: event.pointerId,
            startClientX,
            startClientY,
            offsetX: point.x - annotation.x,
            offsetY: point.y - annotation.y,
            isLongPressed: false,
            isDragging: false,
            hasMoved: false,
          };

          try {
            element.setPointerCapture(event.pointerId);
          } catch (_) {}

          clearTimeout(activeLongPressTimer);
          activeLongPressTimer = setTimeout(() => {
            if (!dragNoteSession || dragNoteSession.annotation.id !== annotation.id) return;
            dragNoteSession.isLongPressed = true;
            dragNoteSession.isDragging = true;
            element.classList.add("dragging");
            showRedDustbin();
            if (navigator.vibrate) {
              try { navigator.vibrate(40); } catch (_) {}
            }
          }, 300);
        }

        function handleGlobalPointerMove(event) {
          if (!dragNoteSession || event.pointerId !== dragNoteSession.pointerId) return;

          const dist = Math.hypot(event.clientX - dragNoteSession.startClientX, event.clientY - dragNoteSession.startClientY);

          if (dist > 5) {
            dragNoteSession.hasMoved = true;
            dragNoteSession.isDragging = true;
            dragNoteSession.element.classList.add("dragging");

            showRedDustbin();

            const currentPoint = getPoint(event, dragNoteSession.layer);
            const nextX = clamp(currentPoint.x - dragNoteSession.offsetX, 0, 0.94);
            const nextY = clamp(currentPoint.y - dragNoteSession.offsetY, 0, 0.94);

            dragNoteSession.annotation.x = nextX;
            dragNoteSession.annotation.y = nextY;
            dragNoteSession.element.style.left = (nextX * 100) + "%";
            dragNoteSession.element.style.top = (nextY * 100) + "%";

            if (elements.redDustbinZone) {
              const rect = elements.redDustbinZone.getBoundingClientRect();
              const isOver = (
                event.clientX >= rect.left &&
                event.clientX <= rect.right &&
                event.clientY >= rect.top &&
                event.clientY <= rect.bottom
              );
              elements.redDustbinZone.classList.toggle("hover-over", isOver);
              dragNoteSession.element.classList.toggle("over-dustbin", isOver);
            }
          }
        }

        function handleGlobalPointerUp(event) {
          if (!dragNoteSession || event.pointerId !== dragNoteSession.pointerId) return;

          clearTimeout(activeLongPressTimer);
          const session = dragNoteSession;
          dragNoteSession = null;

          try {
            session.element.releasePointerCapture(event.pointerId);
          } catch (_) {}

          let isOverDustbin = false;
          if (elements.redDustbinZone && session.isDragging) {
            const rect = elements.redDustbinZone.getBoundingClientRect();
            isOverDustbin = (
              event.clientX >= rect.left &&
              event.clientX <= rect.right &&
              event.clientY >= rect.top &&
              event.clientY <= rect.bottom
            );
          }

          hideRedDustbin();
          session.element.classList.remove("dragging", "over-dustbin");

          if (isOverDustbin) {
            session.element.style.transition = "transform 200ms ease, opacity 200ms ease";
            session.element.style.transform = "scale(0) rotate(45deg)";
            session.element.style.opacity = "0";
            setTimeout(() => {
              removeAnnotation(session.annotation.id);
              setStatus("Note thrown in dustbin 🗑️", "neutral");
            }, 180);
            return;
          }

          if (session.hasMoved) {
            commitChange(snapshot(), session.annotation.id);
            setStatus("Note moved.", "neutral");
            renderAnnotationsForPage(Number(session.annotation.page));
          } else {
            openStickyNote(session.annotation, Number(session.annotation.page));
          }
        }

        function handleGlobalPointerCancel(event) {
          if (!dragNoteSession || event.pointerId !== dragNoteSession.pointerId) return;
          clearTimeout(activeLongPressTimer);
          hideRedDustbin();
          if (dragNoteSession.element) {
            dragNoteSession.element.classList.remove("dragging", "over-dustbin");
          }
          dragNoteSession = null;
        }

        function handleLayerPointerDown(event) {
          if (event.target.closest(".annotation") || event.target.closest(".sticky-note-expanded")) return;

          if (activeExpandedNoteId) {
            if (Date.now() - noteInteractionTimestamp < 400) return;
            minimizeExpandedNote();
            return;
          }

          if (activeTool === "note") {
            event.preventDefault();
            event.stopPropagation();
            const layer = event.currentTarget;
            const pageEl = layer.closest(".pdf-page");
            const pageNumber = Number(pageEl.dataset.pageNumber);
            const point = getPoint(event, layer);
            const author = getActiveUser();
            const palette = getPersonPalette(author);

            const newNote = {
              id: newId("note"),
              type: "sticky-note",
              page: pageNumber,
              x: clamp(point.x - 0.02, 0, 0.92),
              y: clamp(point.y - 0.02, 0, 0.92),
              width: 0.05,
              height: 0.05,
              text: "",
              status: "active",
              color: palette.light,
              createdBy: author,
              createdAt: new Date().toISOString(),
              isDraftNew: true,
            };

            annotations.push(newNote);
            activeExpandedNoteId = newNote.id;
            selectedAnnotationId = newNote.id;
            noteInteractionTimestamp = Date.now();

            renderAnnotationsForPage(pageNumber);

            setTool("pan");
            setStatus("Type your note. Press Enter or click outside to minimize.", "neutral");

            window.setTimeout(() => {
              const expandedEl = document.querySelector(`.sticky-note-expanded[data-annotation-id="${newNote.id}"]`);
              if (expandedEl) {
                const ta = expandedEl.querySelector(".sticky-note-textarea");
                if (ta) ta.focus();
              }
            }, 40);
          }
        }

        function setTool(tool) {
          activeTool = tool;
          document.querySelectorAll("[data-tool]").forEach((button) => {
            button.classList.toggle("active", button.dataset.tool === tool);
          });
          pageLayers.forEach((layer) => {
            layer.classList.toggle("tool-note", tool === "note");
          });

          // Enable text selection on textLayer when tool is highlight or pan
          elements.pages.querySelectorAll(".textLayer").forEach((tl) => {
            tl.style.pointerEvents = (tool === "highlight" || tool === "pan") ? "auto" : "none";
          });

          if (tool === "highlight") {
            setStatus("Select words on document with cursor to highlight.", "neutral");
          } else if (tool === "note") {
            setStatus("Click anywhere on PDF to place note.", "neutral");
          } else {
            setStatus("Select / Pan tool active. Click links or browse.", "neutral");
          }
        }

        function annotationPayload() {
          return annotations.filter(validAnnotation).map((annotation) => {
            const author = annotation.createdBy || getActiveUser();
            const palette = getPersonPalette(author);
            return {
              id: annotation.id,
              type: annotation.type,
              page: Number(annotation.page),
              x: Number(annotation.x || 0),
              y: Number(annotation.y || 0),
              width: Number(annotation.width || 0.05),
              height: Number(annotation.height || 0.05),
              boxes: annotation.boxes || undefined,
              color: annotation.type === "sticky-note" ? palette.light : (annotation.color || "#ffdf5d"),
              opacity: annotation.type === "highlight" ? 0.42 : undefined,
              title: annotation.title ? String(annotation.title).trim() : undefined,
              text: annotation.text ? String(annotation.text).trim() : undefined,
              status: annotation.status || "active",
              createdBy: author,
              createdAt: annotation.createdAt || new Date().toISOString(),
              deletedBy: annotation.deletedBy,
              deletedAt: annotation.deletedAt,
            };
          });
        }

        async function loadAnnotations() {
          let documentData = null;
          let loadedFromApi = false;

          if (hasApi && paperId) {
            try {
              const response = await fetch(apiUrl("/annotations/" + encodeURIComponent(paperId)), {
                cache: "no-store",
              });
              if (!response.ok) throw new Error("API returned " + response.status);
              documentData = await response.json();
              loadedFromApi = true;
            } catch (_error) {}
          }

          if (!documentData && localAnnotationUrl) {
            try {
              const res = await fetch(localAnnotationUrl, { cache: "no-store" });
              if (res.ok) documentData = await res.json();
            } catch (_e) {}
          }

          if (documentData && Array.isArray(documentData.annotations)) {
            annotations = documentData.annotations.filter(validAnnotation);
            annotationRevision = documentData.revision || null;
          } else {
            annotations = [];
            annotationRevision = null;
          }

          undoHistory = [];
          redoHistory = [];
          isDirty = false;
          renderAnnotations();
          updateActionState();

          if (loadedFromApi) {
            setSyncStatus("synced", "Synced with cloud");
            const activeCount = annotations.filter((a) => a.type === "sticky-note" && a.status !== "deleted").length;
            setStatus(
              activeCount
                ? activeCount + " active note" + (activeCount === 1 ? "" : "s") + " loaded."
                : "Ready to highlight or add notes.",
              "success",
            );
          } else {
            setSyncStatus("neutral", "Sync ready");
          }
        }

        /* Solid Manual Save to Cloud */
        async function saveSharedAnnotations() {
          if (!hasApi || isSaving) return;

          isSaving = true;
          elements.save.disabled = true;
          setSyncStatus("dirty", "Saving to cloud…");
          setStatus("Saving annotations to Vercel…", "neutral");

          try {
            const author = getActiveUser();
            const response = await fetch(apiUrl("/annotations/" + encodeURIComponent(paperId)), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                paperId,
                revision: annotationRevision,
                author,
                annotations: annotationPayload(),
              }),
            });

            const data = await response.json().catch(() => ({}));
            if (response.status === 409) {
              if (data && data.revision) {
                annotationRevision = data.revision;
              }
              setSyncStatus("dirty", "Conflict");
              setStatus("Annotations modified remotely. Click 💾 Save again to overwrite with your edits, or reload.", "warning");
              return;
            }
            if (!response.ok) throw new Error(data.message || data.error || `Save failed (HTTP ${response.status})`);

            annotationRevision = data.revision || annotationRevision;
            isDirty = false;
            setSyncStatus("synced", "All saved");
            setStatus("Saved! Annotations synced to cloud.", "success");
          } catch (error) {
            console.error("Save error:", error);
            setSyncStatus("dirty", "Save failed");
            setStatus(error.message || "Save failed. Check Vercel.", "error");
          } finally {
            isSaving = false;
            updateActionState();
          }
        }

        /* Page Jump and Scroll Tracking */
        function scrollToPage(pageNum) {
          const pageElement = elements.pages.querySelector(`[data-page-number="${pageNum}"]`);
          if (pageElement) {
            pageElement.scrollIntoView({ behavior: "smooth", block: "start" });
            updatePageIndicator(pageNum);
            highlightActiveOutlineItem(pageNum);
          }
        }

        function updatePageIndicator(pageNum) {
          currentPageNumber = pageNum;
          elements.pageIndicator.textContent = `${pageNum} / ${totalPages}`;
          elements.prevPageBtn.disabled = pageNum <= 1;
          elements.nextPageBtn.disabled = pageNum >= totalPages;
        }

        function updateVisiblePageFromScroll() {
          const pages = elements.pages.querySelectorAll(".pdf-page");
          if (!pages.length) return;
          const vpRect = elements.viewport.getBoundingClientRect();
          
          let bestPage = currentPageNumber;
          let maxVisibleHeight = -1;

          pages.forEach((p) => {
            const rect = p.getBoundingClientRect();
            // Calculate vertical intersection between page and viewport
            const visibleTop = Math.max(rect.top, vpRect.top);
            const visibleBottom = Math.min(rect.bottom, vpRect.bottom);
            const visibleHeight = Math.max(0, visibleBottom - visibleTop);
            
            if (visibleHeight > maxVisibleHeight) {
              maxVisibleHeight = visibleHeight;
              bestPage = Number(p.dataset.pageNumber);
            }
          });

          if (bestPage && bestPage !== currentPageNumber && bestPage >= 1 && bestPage <= totalPages) {
            updatePageIndicator(bestPage);
            highlightActiveOutlineItem(bestPage);
          }
        }

        elements.viewport.addEventListener("scroll", () => {
          if (!scrollRafPending) {
            requestAnimationFrame(() => {
              updateVisiblePageFromScroll();
              scrollRafPending = false;
            });
            scrollRafPending = true;
          }
        }, { passive: true });

        /* Zoom Controls & Gestures */
        function setZoom(factor) {
          currentZoomLevel = clamp(factor, 0.65, 2.0);
          elements.zoomIndicator.textContent = Math.round(currentZoomLevel * 100) + "%";
          elements.zoomOutBtn.disabled = currentZoomLevel <= 0.7;
          elements.zoomInBtn.disabled = currentZoomLevel >= 1.95;

          renderedPages.clear();
          elements.pages.querySelectorAll(".pdf-page").forEach((el) => {
            el.classList.remove("rendered");
            const width = Math.min(window.innerWidth - 30, Math.round(960 * currentZoomLevel));
            el.style.width = width + "px";
            el.style.minHeight = Math.round(width * basePageRatio) + "px";
          });

          renderPageCanvas(currentPageNumber);
          if (currentPageNumber + 1 <= totalPages) renderPageCanvas(currentPageNumber + 1);
          if (currentPageNumber - 1 >= 1) renderPageCanvas(currentPageNumber - 1);
        }

        // Two-Finger Trackpad Pinch-to-Zoom (wheel + ctrlKey) with smooth debounced re-renders
        let targetPinchZoom = currentZoomLevel;
        let pinchZoomRerenderTimer = null;

        elements.viewport.addEventListener("wheel", (event) => {
          if (event.ctrlKey) {
            event.preventDefault();
            const delta = -event.deltaY;
            const factor = delta > 0 ? 1.03 : 0.97;
            targetPinchZoom = clamp(targetPinchZoom * factor, 0.65, 2.0);

            elements.zoomIndicator.textContent = Math.round(targetPinchZoom * 100) + "%";
            elements.zoomOutBtn.disabled = targetPinchZoom <= 0.7;
            elements.zoomInBtn.disabled = targetPinchZoom >= 1.95;

            elements.pages.querySelectorAll(".pdf-page").forEach((el) => {
              const width = Math.min(window.innerWidth - 30, Math.round(960 * targetPinchZoom));
              el.style.width = width + "px";
              el.style.minHeight = Math.round(width * basePageRatio) + "px";
            });

            clearTimeout(pinchZoomRerenderTimer);
            pinchZoomRerenderTimer = setTimeout(() => {
              currentZoomLevel = targetPinchZoom;
              renderedPages.clear();
              renderPageCanvas(currentPageNumber);
              if (currentPageNumber + 1 <= totalPages) renderPageCanvas(currentPageNumber + 1);
              if (currentPageNumber - 1 >= 1) renderPageCanvas(currentPageNumber - 1);
            }, 120);
          }
        }, { passive: false });

        /* Outline / Headings Sidebar Extraction & Navigation */
        function highlightActiveOutlineItem(pageNum) {
          const items = elements.outlineTree.querySelectorAll(".outline-item");
          let bestEl = null;
          let bestPage = -1;

          items.forEach((item) => {
            const p = Number(item.dataset.page);
            if (p && p <= pageNum && p >= bestPage) {
              bestPage = p;
              bestEl = item;
            }
          });

          items.forEach((item) => item.classList.remove("active"));
          if (bestEl) bestEl.classList.add("active");
        }

        /* Resolve PDF Destination to 1-based Page Number */
        async function resolveDestinationPage(destRef) {
          if (!destRef || !pdfDoc) return null;
          try {
            const dest = typeof destRef === "string" ? await pdfDoc.getDestination(destRef) : destRef;
            if (!dest || !dest.length) return null;
            const target = dest[0];
            if (typeof target === "number") {
              return target + 1;
            }
            if (target && typeof target === "object") {
              const pageIdx = await pdfDoc.getPageIndex(target);
              return typeof pageIdx === "number" ? pageIdx + 1 : null;
            }
          } catch (err) {
            console.warn("Could not resolve destination:", destRef, err);
          }
          return null;
        }

        async function loadDocumentOutline() {
          if (!pdfDoc) return;
          elements.outlineTree.innerHTML = "";

          let outlineItems = [];
          try {
            outlineItems = await pdfDoc.getOutline();
          } catch (_e) {}

          if (outlineItems && outlineItems.length) {
            await renderOutlineItems(outlineItems, elements.outlineTree, 1);
          } else {
            // Heuristic heading scanner
            await scanAndRenderHeadings();
          }
        }

        async function renderOutlineItems(items, container, depth) {
          for (const item of items) {
            const pageNum = await resolveDestinationPage(item.dest);

            const itemEl = document.createElement("div");
            itemEl.className = `outline-item depth-${Math.min(depth, 3)}`;
            if (pageNum) itemEl.dataset.page = pageNum;
            itemEl.innerHTML = `
              <span class="outline-title-text" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
              ${pageNum ? `<span class="outline-page-num">${pageNum}</span>` : ""}
            `;

            if (pageNum) {
              itemEl.addEventListener("click", () => {
                scrollToPage(pageNum);
                if (window.innerWidth <= 768) {
                  elements.outlineSidebar.classList.add("collapsed");
                  if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
                }
              });
            }

            container.appendChild(itemEl);

            if (item.items && item.items.length) {
              await renderOutlineItems(item.items, container, depth + 1);
            }
          }
        }

        async function scanAndRenderHeadings() {
          const headingRegex = /^(?:(?:[IVXLCDM]+|[0-9]+(?:\.[0-9]+)*)\.?\s+[A-Z][A-Za-z0-9\s,\-–—:]{2,60}|Abstract|References|Conclusions?|Methodology|Discussion|Introduction|Related Works?|Background)$/i;
          const excludeRegex = /volume\s+\d+|ieee\s+access|page\s+\d+|doi:|http|^\d+(\.\d+)?\s+(m|cm|mm|kg|s|ms|hz|khz|mhz|ghz|v|w|pa|kpa|%)/i;
          const found = [];

          for (let p = 1; p <= Math.min(pdfDoc.numPages, 35); p++) {
            try {
              const page = await pdfDoc.getPage(p);
              const tc = await page.getTextContent();
              for (const item of tc.items) {
                const str = item.str.trim();
                if (str && item.height >= 9.5 && headingRegex.test(str) && !excludeRegex.test(str)) {
                  const isSub = str.includes(".") || /^[A-Z]\.\s+/.test(str);
                  found.push({ title: str, page: p, depth: isSub ? 2 : 1 });
                }
              }
            } catch (_err) {}
          }

          if (!found.length) {
            elements.outlineTree.innerHTML = '<div class="outline-item" style="color:var(--muted)">No outline detected.</div>';
            return;
          }

          elements.outlineTree.innerHTML = "";
          found.forEach((h) => {
            const itemEl = document.createElement("div");
            itemEl.className = `outline-item depth-${h.depth}`;
            itemEl.dataset.page = h.page;
            itemEl.innerHTML = `
              <span class="outline-title-text" title="${escapeHtml(h.title)}">${escapeHtml(h.title)}</span>
              <span class="outline-page-num">${h.page}</span>
            `;
            itemEl.addEventListener("click", () => {
              scrollToPage(h.page);
              if (window.innerWidth <= 768) {
                elements.outlineSidebar.classList.add("collapsed");
                if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
              }
            });
            elements.outlineTree.appendChild(itemEl);
          });
        }

        /* Render Page Canvas, TextLayer & Internal Links */
        async function renderPageCanvas(pageNumber) {
          if (!pdfDoc || renderedPages.has(pageNumber) || renderingPages.has(pageNumber)) return;
          renderingPages.add(pageNumber);

          const pageElement = elements.pages.querySelector(`[data-page-number="${pageNumber}"]`);
          if (!pageElement) {
            renderingPages.delete(pageNumber);
            return;
          }

          try {
            const page = await pdfDoc.getPage(pageNumber);
            const baseViewport = page.getViewport({ scale: 1 });
            const containerWidth = pageElement.clientWidth || 960;
            const cssScale = containerWidth / baseViewport.width;
            const viewport = page.getViewport({ scale: cssScale });
            const outputScale = window.devicePixelRatio || 1;

            // 1. Render Canvas with High-DPI Matrix Transform
            const canvas = pageElement.querySelector("canvas");
            const context = canvas.getContext("2d", {
              alpha: false,
              desynchronized: true,
              willReadFrequently: false,
            });
            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = Math.floor(viewport.width) + "px";
            canvas.style.height = Math.floor(viewport.height) + "px";
            pageElement.style.width = Math.floor(viewport.width) + "px";
            pageElement.style.height = Math.floor(viewport.height) + "px";

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

            await page.render({
              canvasContext: context,
              transform,
              viewport,
              intent: "display",
            }).promise;

            // 2. Render TextLayer (Pixel-Exact Matching for Text Selection & Highlights)
            let textLayerDiv = pageElement.querySelector(".textLayer");
            if (!textLayerDiv) {
              textLayerDiv = document.createElement("div");
              textLayerDiv.className = "textLayer";
              pageElement.appendChild(textLayerDiv);
            }
            textLayerDiv.innerHTML = "";
            textLayerDiv.style.width = Math.floor(viewport.width) + "px";
            textLayerDiv.style.height = Math.floor(viewport.height) + "px";
            textLayerDiv.style.setProperty("--scale-factor", String(viewport.scale));

            const textContent = await page.getTextContent();
            if (typeof window.pdfjsLib.renderTextLayer === "function") {
              await window.pdfjsLib.renderTextLayer({
                textContentSource: textContent,
                container: textLayerDiv,
                viewport,
              }).promise;
            }

            // 3. Render Link Layer (Internal Reference & Citation Links)
            let linkLayerDiv = pageElement.querySelector(".pdf-link-layer");
            if (!linkLayerDiv) {
              linkLayerDiv = document.createElement("div");
              linkLayerDiv.className = "pdf-link-layer";
              pageElement.appendChild(linkLayerDiv);
            }
            linkLayerDiv.innerHTML = "";

            try {
              const annos = await page.getAnnotations({ intent: "display" });
              for (const ann of annos) {
                if (ann.subtype === "Link" && ann.rect) {
                  const [vx1, vy1, vx2, vy2] = viewport.convertToViewportRectangle(ann.rect);
                  const linkEl = document.createElement("a");
                  linkEl.className = "pdf-internal-link";
                  linkEl.style.left = (Math.min(vx1, vx2) / viewport.width) * 100 + "%";
                  linkEl.style.top = (Math.min(vy1, vy2) / viewport.height) * 100 + "%";
                  linkEl.style.width = (Math.abs(vx2 - vx1) / viewport.width) * 100 + "%";
                  linkEl.style.height = (Math.abs(vy2 - vy1) / viewport.height) * 100 + "%";

                  if (ann.url) {
                    linkEl.href = ann.url;
                    linkEl.target = "_blank";
                    linkEl.rel = "noopener noreferrer";
                    linkEl.title = `External link: ${ann.url}`;
                  } else if (ann.dest) {
                    linkEl.href = "#";
                    linkEl.title = "Jump to reference / section";
                    linkEl.addEventListener("click", async (e) => {
                      e.preventDefault();
                      e.stopPropagation();
                      const targetPage = await resolveDestinationPage(ann.dest);
                      if (targetPage) scrollToPage(targetPage);
                    });
                  }
                  linkLayerDiv.appendChild(linkEl);
                }
              }
            } catch (_linkErr) {}

            renderedPages.add(pageNumber);
            pageElement.classList.add("rendered");
            renderAnnotationsForPage(pageNumber);
          } catch (error) {
            console.error("Page render error:", error);
          } finally {
            renderingPages.delete(pageNumber);
          }
        }

        async function renderPdf() {
          if (!pdfUrl) {
            setEmpty("No PDF file provided.");
            return;
          }
          if (typeof window.pdfjsLib === "undefined") {
            setEmpty("PDF viewer library not loaded.");
            return;
          }

          try {
            setStatus("Loading PDF…", "neutral");
            const loadingTask = window.pdfjsLib.getDocument({
              url: pdfUrl,
              withCredentials: false,
              disableAutoFetch: true,
              disableStream: false,
              rangeChunkSize: 65536,
              cMapUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/",
              cMapPacked: true,
              enableXfa: false,
              isEvalSupported: true,
            });

            pdfDoc = await loadingTask.promise;
            clearEmpty();
            elements.pages.innerHTML = "";
            pageLayers = new Map();
            renderedPages = new Set();
            renderingPages = new Set();
            totalPages = pdfDoc.numPages;

            const firstPage = await pdfDoc.getPage(1);
            const firstVp = firstPage.getViewport({ scale: 1 });
            basePageRatio = firstVp.height / firstVp.width;
            const baseWidth = Math.min(elements.viewport.clientWidth - 30, 960);
            const placeholderHeight = Math.round(baseWidth * basePageRatio);

            updatePageIndicator(1);

            if (pageObserver) pageObserver.disconnect();
            pageObserver = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  const pNum = Number(entry.target.dataset.pageNumber);
                  renderPageCanvas(pNum);
                }
              });
            }, {
              root: elements.viewport,
              rootMargin: "500px 0px",
            });

            for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
              const pageElement = document.createElement("section");
              pageElement.className = "pdf-page";
              pageElement.dataset.pageNumber = String(pageNumber);
              pageElement.style.minHeight = placeholderHeight + "px";

              const canvas = document.createElement("canvas");
              pageElement.appendChild(canvas);

              const layer = document.createElement("div");
              layer.className = "annotation-layer";
              pageElement.appendChild(layer);
              pageLayers.set(pageNumber, layer);

              layer.addEventListener("pointerdown", handleLayerPointerDown);

              elements.pages.appendChild(pageElement);
              pageObserver.observe(pageElement);
            }

            // Priority render Page 1 and 2
            await renderPageCanvas(1);
            if (pdfDoc.numPages >= 2) {
              renderPageCanvas(2);
            }

            // Load outline into Left Sidebar
            loadDocumentOutline();

            setStatus("PDF ready (" + pdfDoc.numPages + " pages).", "success");
          } catch (error) {
            console.error(error);
            setEmpty("PDF could not be loaded: " + (error.message || "network error"));
            setStatus("Could not open PDF.", "error");
          }
        }

        // Event Listeners
        document.querySelectorAll("[data-tool]").forEach((btn) => {
          btn.addEventListener("click", () => setTool(btn.dataset.tool));
        });

        elements.color.addEventListener("input", (e) => {
          elements.colorPreview.style.background = e.target.value;
          renderAnnotations();
        });

        elements.undo.addEventListener("click", undo);
        elements.redo.addEventListener("click", redo);
        elements.save.addEventListener("click", saveSharedAnnotations);

        // Outline Sidebar Listeners
        elements.toggleOutlineBtn.addEventListener("click", () => {
          const isCollapsed = elements.outlineSidebar.classList.toggle("collapsed");
          if (!isCollapsed) {
            elements.notesDrawer.classList.add("collapsed");
            if (window.innerWidth <= 768 && elements.mobileBackdrop) {
              elements.mobileBackdrop.classList.add("active");
            }
          } else {
            if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
          }
        });
        elements.closeOutlineBtn.addEventListener("click", () => {
          elements.outlineSidebar.classList.add("collapsed");
          if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
        });

        // Identity switch handler
        elements.userSelectorBtn.addEventListener("click", () => {
          const current = getActiveUser();
          const next = prompt("Enter your contributor name for notes:", current === "Unknown User" ? "" : current);
          if (next && next.trim() && next.trim() !== current) {
            setActiveUser(next.trim());
            setStatus("Active contributor: " + next.trim(), "neutral");
            renderAnnotations();
          }
        });

        // Page Jump Listeners
        elements.prevPageBtn.addEventListener("click", () => {
          if (currentPageNumber > 1) scrollToPage(currentPageNumber - 1);
        });
        elements.nextPageBtn.addEventListener("click", () => {
          if (currentPageNumber < totalPages) scrollToPage(currentPageNumber + 1);
        });

        // Zoom Listeners
        elements.zoomInBtn.addEventListener("click", () => setZoom(currentZoomLevel + 0.15));
        elements.zoomOutBtn.addEventListener("click", () => setZoom(currentZoomLevel - 0.15));

        // Drawer Listeners & Tab Switching
        elements.toggleNotesDrawerBtn.addEventListener("click", () => {
          const isCollapsed = elements.notesDrawer.classList.toggle("collapsed");
          if (!isCollapsed) {
            elements.outlineSidebar.classList.add("collapsed");
            if (window.innerWidth <= 768 && elements.mobileBackdrop) {
              elements.mobileBackdrop.classList.add("active");
            }
          } else {
            if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
          }
        });
        elements.closeDrawerBtn.addEventListener("click", () => {
          elements.notesDrawer.classList.add("collapsed");
          if (elements.mobileBackdrop) elements.mobileBackdrop.classList.remove("active");
        });

        if (elements.mobileBackdrop) {
          elements.mobileBackdrop.addEventListener("click", () => {
            elements.outlineSidebar.classList.add("collapsed");
            elements.notesDrawer.classList.add("collapsed");
            elements.mobileBackdrop.classList.remove("active");
          });
        }

        elements.tabActiveNotes.addEventListener("click", () => {
          currentDrawerTab = "active";
          elements.tabActiveNotes.classList.add("active");
          elements.tabTimeline.classList.remove("active");
          elements.drawerNotesList.style.display = "flex";
          elements.drawerTimelineList.style.display = "none";
        });

        elements.tabTimeline.addEventListener("click", () => {
          currentDrawerTab = "timeline";
          elements.tabTimeline.classList.add("active");
          elements.tabActiveNotes.classList.remove("active");
          elements.drawerTimelineList.style.display = "flex";
          elements.drawerNotesList.style.display = "none";
        });

        // Popover Listeners
        elements.noteEditBody.addEventListener("submit", saveNote);
        elements.cancelNoteButton.addEventListener("click", closeNoteEditor);
        elements.closeNoteButton.addEventListener("click", closeNoteEditor);

        elements.editNoteButton.addEventListener("click", () => {
          if (!noteDraft || !noteDraft.annotation) return;
          showNoteEditor(noteDraft, "edit");
        });

        elements.deleteNoteDirectButton.addEventListener("click", () => {
          if (!noteDraft || !noteDraft.annotation) return;
          removeAnnotation(noteDraft.annotation.id);
        });

        document.addEventListener("pointermove", handleGlobalPointerMove);
        document.addEventListener("pointerup", handleGlobalPointerUp);
        document.addEventListener("pointercancel", handleGlobalPointerCancel);

        // Click outside of expanded sticky note minimizes it
        document.addEventListener("pointerdown", (event) => {
          if (!activeExpandedNoteId) return;
          if (Date.now() - noteInteractionTimestamp < 400) return;
          if (event.target.closest(".sticky-note-expanded")) return;
          if (event.target.closest("[data-tool='note']")) return;
          minimizeExpandedNote();
        });

        // Keyboard Shortcuts (Ctrl+Z / Cmd+Z for Undo, Ctrl+Shift+Z / Cmd+Shift+Z / Ctrl+Y for Redo, Ctrl+S for Save)
        document.addEventListener("keydown", (event) => {
          const tagName = document.activeElement && document.activeElement.tagName;
          const isInput = tagName === "TEXTAREA" || tagName === "INPUT";

          if (event.key === "Escape") {
            closeNoteEditor();
            elements.notesDrawer.classList.add("collapsed");
          }

          if ((event.key === "Delete" || event.key === "Backspace") && !isInput) {
            if (selectedAnnotationId) removeAnnotation(selectedAnnotationId);
          }

          if ((event.metaKey || event.ctrlKey) && !isInput) {
            const key = event.key.toLowerCase();
            if (key === "z") {
              event.preventDefault();
              if (event.shiftKey) {
                redo();
              } else {
                undo();
              }
            } else if (key === "y") {
              event.preventDefault();
              redo();
            } else if (key === "s") {
              event.preventDefault();
              saveSharedAnnotations();
            }
          }

          if (!isInput) {
            if (event.key === "ArrowRight" || event.key === "PageDown") {
              if (currentPageNumber < totalPages) scrollToPage(currentPageNumber + 1);
            } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
              if (currentPageNumber > 1) scrollToPage(currentPageNumber - 1);
            }
          }
        });

        // Startup
        updateUserDisplay();
        loadAnnotations();
        renderPdf();
      })();
    </script>
  </body>
</html>
